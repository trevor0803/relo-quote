name: Build Jon Consultation Survey

on:
  push:
    branches:
      - jon-nelson-custom
    paths:
      - .github/workflows/build-jon-survey.yml

permissions:
  contents: write

jobs:
  build-survey:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: jon-nelson-custom

      - name: Replace consultation form with survey flow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          page = path.read_text(encoding='utf-8')

          old_css = """    .send{margin-top:24px;border:0;background:#111;color:#fff;padding:14px 16px;font-size:11px;letter-spacing:.15em;text-transform:uppercase}\n"""
          new_css = """    .send{margin-top:24px;border:0;background:#111;color:#fff;padding:14px 16px;font-size:11px;letter-spacing:.15em;text-transform:uppercase}\n    .surveyTop{margin-top:62px}\n    .surveyKicker{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#777;margin-bottom:10px}\n    .surveyProgress{height:2px;background:#c9c4bc;margin:0 0 34px;overflow:hidden}\n    .surveyProgress span{display:block;height:100%;width:25%;background:#111;transition:width .3s ease}\n    .surveyStep{display:none}\n    .surveyStep.active{display:block}\n    .surveyStep h3{font:600 clamp(48px,7vw,84px)/.84 var(--c);margin:0 0 14px;text-transform:uppercase}\n    .surveyStep p{margin:0 0 22px;color:#625e58;max-width:560px}\n    .surveyAnswers{display:grid;gap:10px}\n    .surveyAnswer{width:100%;text-align:left;border:1px solid #b8b2aa;background:transparent;color:#111;padding:16px 46px 16px 16px;position:relative;font-size:15px}\n    .surveyAnswer:after{content:'›';position:absolute;right:16px;top:50%;transform:translateY(-52%);font-size:25px}\n    .surveyAnswer:hover,.surveyAnswer:focus-visible{background:#111;color:#fff;border-color:#111}\n    .surveyBack{margin-top:18px;border:0;background:transparent;padding:0;color:#777;font-size:10px;letter-spacing:.14em;text-transform:uppercase}\n    .surveyStatus{display:none;margin:0 0 18px;padding:12px 14px;border:1px solid #c4beb5;font-size:12px;line-height:1.45;color:#555}\n    .surveyStatus.show{display:block}\n    .contactGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}\n    .contactGrid label{font-size:9px;letter-spacing:.13em;color:#666;text-transform:uppercase}\n    .contactGrid input,.contactGrid textarea,.contactGrid select{display:block;width:100%;border:0;border-bottom:1px solid #999;background:transparent;padding:10px 0;font-size:16px;color:#111;outline:0}\n    .contactGrid textarea{resize:vertical;min-height:82px}\n    .contactGrid .wide{grid-column:1/-1}\n    .uploadBox{border:1px dashed #aaa!important;padding:16px!important;margin-top:8px;background:#f5f1eb!important}\n    .uploadHelp{display:block;margin-top:7px;font-size:10px;line-height:1.4;letter-spacing:0;text-transform:none;color:#777}\n    .surveySubmit{width:100%;margin-top:20px;border:0;background:#111;color:#fff;padding:16px;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}\n    .surveyFine{margin-top:10px!important;font-size:10px!important;color:#777!important}\n"""
          if old_css not in page:
              raise RuntimeError('Base submit CSS not found')
          page = page.replace(old_css, new_css, 1)

          old_mobile = """      .form{grid-template-columns:1fr}.full{grid-column:auto}footer{display:grid;padding-bottom:100px}\n"""
          new_mobile = """      .form{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:18px 16px 36px}.surveyTop{margin-top:48px}.surveyProgress{margin-bottom:28px}.surveyStep h3{font-size:52px}.surveyAnswer{padding:15px 42px 15px 14px}.contactGrid{grid-template-columns:1fr;gap:16px}.contactGrid .wide{grid-column:auto}footer{display:grid;padding-bottom:100px}\n"""
          if old_mobile not in page:
              raise RuntimeError('Mobile form CSS not found')
          page = page.replace(old_mobile, new_mobile, 1)

          old_modal = """  <div class=\"modal\" id=\"modal\" aria-hidden=\"true\"><div class=\"panel\"><button class=\"close\" id=\"close\">CLOSE ×</button><h3>YOUR<br>PROJECT.</h3><p>Tell us what you want to build. Jon’s team can review the idea and follow up about a consultation.</p><form id=\"form\"><div class=\"form\"><label>FIRST NAME<input name=\"first\" required></label><label>LAST NAME<input name=\"last\" required></label><label>EMAIL<input type=\"email\" name=\"email\" required></label><label>PHONE<input type=\"tel\" name=\"phone\" required></label><label class=\"full\">WHAT ARE YOU THINKING?<textarea name=\"idea\" rows=\"4\"></textarea></label><label>PLACEMENT<input name=\"placement\"></label><label>PROJECT SCALE<select name=\"scale\"><option>Standalone piece</option><option>Half sleeve</option><option>Full sleeve</option><option>Large scale / multi-session</option><option>Not sure yet</option></select></label></div><button class=\"send\" type=\"submit\">Prepare consultation request</button></form></div></div>\n"""
          new_modal = """  <div class=\"modal\" id=\"modal\" aria-hidden=\"true\">\n    <div class=\"panel\">\n      <button class=\"close\" id=\"close\">CLOSE ×</button>\n      <div class=\"surveyTop\">\n        <div class=\"surveyKicker\">Jon Nelson · Consultation Request</div>\n        <div class=\"surveyProgress\"><span id=\"surveyProgressBar\"></span></div>\n        <form id=\"form\">\n          <input type=\"hidden\" name=\"qualification\" id=\"qualification\" value=\"qualified\">\n          <input type=\"hidden\" name=\"dq_reason\" id=\"dqReason\" value=\"\">\n          <input type=\"hidden\" name=\"color_ok\" id=\"colorOk\" value=\"\">\n          <input type=\"hidden\" name=\"creative_freedom\" id=\"creativeFreedom\" value=\"\">\n          <input type=\"hidden\" name=\"budget\" id=\"budgetAnswer\" value=\"\">\n\n          <section class=\"surveyStep active\" data-step=\"0\">\n            <h3>BLACK &amp; GREY<br>ONLY.</h3>\n            <p>Jon works exclusively in black and grey. Are you comfortable moving forward without color?</p>\n            <div class=\"surveyAnswers\">\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"colorOk\" data-value=\"Yes - black and grey works\">Yes — black &amp; grey works for me</button>\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"colorOk\" data-value=\"No - wants color\" data-dq=\"Wants Color\">No — I want color</button>\n            </div>\n          </section>\n\n          <section class=\"surveyStep\" data-step=\"1\">\n            <h3>CREATIVE<br>FREEDOM.</h3>\n            <p>You can share references and your concept, but Jon needs creative freedom to design the final piece in his style. Are you comfortable with that?</p>\n            <div class=\"surveyAnswers\">\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"creativeFreedom\" data-value=\"Yes - gives creative freedom\">Yes — I trust Jon’s creative direction</button>\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"creativeFreedom\" data-value=\"No - wants full design control\" data-dq=\"No Creative Freedom\">No — I need full control of the final design</button>\n            </div>\n            <button class=\"surveyBack\" type=\"button\">← Back</button>\n          </section>\n\n          <section class=\"surveyStep\" data-step=\"2\">\n            <h3>FULL-DAY<br>SESSIONS.</h3>\n            <p>Jon books full-day sessions. Depending on the project, day rates generally range from $2,500–$4,500. Is that within a range you could work with?</p>\n            <div class=\"surveyAnswers\">\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"budgetAnswer\" data-value=\"Yes - budget works\">Yes — that works for me</button>\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"budgetAnswer\" data-value=\"Maybe - needs scope\">Possibly — I need to understand the project scope</button>\n              <button class=\"surveyAnswer\" type=\"button\" data-field=\"budgetAnswer\" data-value=\"No - outside budget\" data-dq=\"Budget\">No — that is outside my budget</button>\n            </div>\n            <button class=\"surveyBack\" type=\"button\">← Back</button>\n          </section>\n\n          <section class=\"surveyStep\" data-step=\"3\">\n            <h3>TELL US<br>WHERE TO REACH YOU.</h3>\n            <p id=\"contactIntro\">Give Jon’s team a little context and the best way to reach you.</p>\n            <div class=\"surveyStatus\" id=\"surveyStatus\"></div>\n            <div class=\"contactGrid\">\n              <label>First name<input name=\"first\" autocomplete=\"given-name\" required></label>\n              <label>Last name<input name=\"last\" autocomplete=\"family-name\" required></label>\n              <label>Email<input type=\"email\" name=\"email\" autocomplete=\"email\" required></label>\n              <label>Phone<input type=\"tel\" name=\"phone\" autocomplete=\"tel\" required></label>\n              <label class=\"wide\">Tattoo placement\n                <select name=\"placement\" required>\n                  <option value=\"\" selected disabled>Select the area</option>\n                  <option>Arm / Sleeve</option><option>Forearm</option><option>Hand</option><option>Chest</option><option>Back</option><option>Ribs / Torso</option><option>Leg / Thigh</option><option>Calf</option><option>Neck / Head</option><option>Other</option>\n                </select>\n              </label>\n              <label class=\"wide\">Concept / reference images (optional)\n                <input class=\"uploadBox\" type=\"file\" name=\"concept_images\" id=\"conceptImages\" accept=\"image/*\" multiple>\n                <span class=\"uploadHelp\">Add any reference images you already have. You can also send them when Jon’s team follows up.</span>\n              </label>\n              <label class=\"wide\">Special notes (optional)<textarea name=\"notes\" rows=\"4\" placeholder=\"Concept, size, specific details, questions, or anything Jon should know.\"></textarea></label>\n            </div>\n            <button class=\"surveySubmit\" type=\"submit\">Send consultation request</button>\n            <p class=\"surveyFine\">Jon’s team will review your request and follow up about next steps.</p>\n            <button class=\"surveyBack\" type=\"button\">← Back</button>\n          </section>\n        </form>\n      </div>\n    </div>\n  </div>\n"""
          if old_modal not in page:
              raise RuntimeError('Existing consultation modal was not found')
          page = page.replace(old_modal, new_modal, 1)

          old_modal_js = """    const formModal=document.getElementById('modal');\n    const openForm=()=>{formModal.classList.add('open');formModal.setAttribute('aria-hidden','false');document.body.classList.add('locked')};\n    const closeForm=()=>{formModal.classList.remove('open');formModal.setAttribute('aria-hidden','true');document.body.classList.remove('locked')};\n    document.querySelectorAll('.open').forEach(button=>button.addEventListener('click',openForm));\n    document.getElementById('close').addEventListener('click',closeForm);\n    formModal.addEventListener('click',event=>{if(event.target===formModal)closeForm()});\n\n"""
          new_modal_js = """    const formModal=document.getElementById('modal');\n    const surveyForm=document.getElementById('form');\n    const surveySteps=Array.from(document.querySelectorAll('.surveyStep'));\n    const surveyProgressBar=document.getElementById('surveyProgressBar');\n    const qualification=document.getElementById('qualification');\n    const dqReason=document.getElementById('dqReason');\n    const surveyStatus=document.getElementById('surveyStatus');\n    const contactIntro=document.getElementById('contactIntro');\n    let surveyStep=0;\n    const surveyAnswers={colorOk:'',creativeFreedom:'',budgetAnswer:''};\n\n    const showSurveyStep=index=>{\n      surveyStep=Math.max(0,Math.min(index,surveySteps.length-1));\n      surveySteps.forEach((step,i)=>step.classList.toggle('active',i===surveyStep));\n      surveyProgressBar.style.width=((surveyStep+1)/surveySteps.length*100)+'%';\n      if(surveyStep===3){\n        const isDQ=qualification.value==='disqualified';\n        surveyStatus.classList.toggle('show',isDQ);\n        surveyStatus.textContent=isDQ?'Jon may not be the right fit for this exact request, but we can still keep your information and follow up with options.':'Your answers look like a potential fit for Jon. Add your contact details and tattoo placement below.';\n        contactIntro.textContent=isDQ?'Leave your details and we can still point you toward the best next step.':'Give Jon’s team a little context and the best way to reach you.';\n      }\n    };\n    const recomputeQualification=()=>{\n      const reasons=[];\n      if(surveyAnswers.colorOk==='No - wants color')reasons.push('Wants Color');\n      if(surveyAnswers.creativeFreedom==='No - wants full design control')reasons.push('No Creative Freedom');\n      if(surveyAnswers.budgetAnswer==='No - outside budget')reasons.push('Budget');\n      qualification.value=reasons.length?'disqualified':(surveyAnswers.budgetAnswer==='Maybe - needs scope'?'budget_review':'qualified');\n      dqReason.value=reasons.join(', ');\n    };\n    const resetSurvey=()=>{\n      surveyForm.reset();\n      surveyAnswers.colorOk='';surveyAnswers.creativeFreedom='';surveyAnswers.budgetAnswer='';\n      qualification.value='qualified';dqReason.value='';\n      ['colorOk','creativeFreedom','budgetAnswer'].forEach(id=>document.getElementById(id).value='');\n      showSurveyStep(0);\n    };\n    const openForm=()=>{resetSurvey();formModal.classList.add('open');formModal.setAttribute('aria-hidden','false');document.body.classList.add('locked')};\n    const closeForm=()=>{formModal.classList.remove('open');formModal.setAttribute('aria-hidden','true');document.body.classList.remove('locked')};\n    document.querySelectorAll('.open').forEach(button=>button.addEventListener('click',openForm));\n    document.getElementById('close').addEventListener('click',closeForm);\n    formModal.addEventListener('click',event=>{if(event.target===formModal)closeForm()});\n    document.querySelectorAll('.surveyAnswer').forEach(button=>button.addEventListener('click',()=>{\n      const field=button.dataset.field;\n      const value=button.dataset.value;\n      surveyAnswers[field]=value;\n      document.getElementById(field).value=value;\n      recomputeQualification();\n      showSurveyStep(surveyStep+1);\n    }));\n    document.querySelectorAll('.surveyBack').forEach(button=>button.addEventListener('click',()=>showSurveyStep(surveyStep-1)));\n    showSurveyStep(0);\n\n"""
          if old_modal_js not in page:
              raise RuntimeError('Existing modal JS was not found')
          page = page.replace(old_modal_js, new_modal_js, 1)

          old_submit = """    document.getElementById('form').addEventListener('submit',event=>{\n      event.preventDefault();\n      const data=new FormData(event.target);\n      const subject=encodeURIComponent('Jon Nelson consultation request — '+(data.get('first')||'')+' '+(data.get('last')||''));\n      const body=encodeURIComponent('Name: '+data.get('first')+' '+data.get('last')+'\\nEmail: '+data.get('email')+'\\nPhone: '+data.get('phone')+'\\nIdea: '+data.get('idea')+'\\nPlacement: '+data.get('placement')+'\\nScale: '+data.get('scale'));\n      location.href='mailto:jonnelsontattoos@gmail.com?subject='+subject+'&body='+body;\n    });\n"""
          new_submit = """    surveyForm.addEventListener('submit',event=>{\n      event.preventDefault();\n      const data=new FormData(event.target);\n      const selectedFiles=Array.from(document.getElementById('conceptImages').files||[]).map(file=>file.name);\n      const subject=encodeURIComponent('Jon Nelson consultation request — '+(data.get('first')||'')+' '+(data.get('last')||''));\n      const body=encodeURIComponent(\n        'Name: '+data.get('first')+' '+data.get('last')+'\\n'+\n        'Email: '+data.get('email')+'\\n'+\n        'Phone: '+data.get('phone')+'\\n'+\n        'Qualification: '+data.get('qualification')+'\\n'+\n        'DQ reason: '+(data.get('dq_reason')||'None')+'\\n'+\n        'Black & grey: '+data.get('color_ok')+'\\n'+\n        'Creative freedom: '+data.get('creative_freedom')+'\\n'+\n        'Budget: '+data.get('budget')+'\\n'+\n        'Placement: '+data.get('placement')+'\\n'+\n        'Special notes: '+(data.get('notes')||'None')+'\\n'+\n        'Selected concept files: '+(selectedFiles.length?selectedFiles.join(', '):'None')\n      );\n      location.href='mailto:jonnelsontattoos@gmail.com?subject='+subject+'&body='+body;\n    });\n"""
          if old_submit not in page:
              raise RuntimeError('Existing submit handler was not found')
          page = page.replace(old_submit, new_submit, 1)

          path.write_text(page, encoding='utf-8')
          PY

      - name: Commit survey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add streamlined Jon qualification survey"
          git push origin HEAD:jon-nelson-custom
