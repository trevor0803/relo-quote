name: Fix Jon Lower Photo

on:
  push:
    branches:
      - jon-nelson-custom
    paths:
      - .github/workflows/fix-jon-last-photo.yml

permissions:
  contents: write

jobs:
  fix-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: jon-nelson-custom

      - name: Correct the broken lower image URL
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          page = path.read_text(encoding='utf-8')
          broken = 'https://cdn.prod.website-files.com/6692f96bc16e92e88e87f089/669308e9c16e92e88e87f0fe/669308e9c16e92e88e90746f_IMG_2798.jpg'
          correct = 'https://cdn.prod.website-files.com/6692f96bc16e92e88e87f089/669308e9c16e92e88e90746f_IMG_2798.jpg'
          if broken not in page:
              raise RuntimeError('Broken lower image URL was not found')
          page = page.replace(broken, correct, 1)
          path.write_text(page, encoding='utf-8')
          PY

      - name: Commit corrected image URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix lower Jon photo on mobile"
          git push origin HEAD:jon-nelson-custom
