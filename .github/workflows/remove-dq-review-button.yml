name: Remove DQ Review Button

on:
  push:
    branches:
      - jon-nelson-custom
    paths:
      - .github/workflows/remove-dq-review-button.yml

permissions:
  contents: write

jobs:
  update-survey:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: jon-nelson-custom

      - name: Remove review answers option
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          page = path.read_text(encoding='utf-8')
          page = page.replace('              <button class="dqSecondary" id="dqBack" type="button">Review my answers</button>\n', '', 1)
          page = page.replace("    const dqBack=document.getElementById('dqBack');\n", '', 1)
          page = page.replace("    dqBack.addEventListener('click',()=>{disqualifiedScreen.classList.remove('active');showSurveyStep(surveyStep)});\n", '', 1)
          path.write_text(page, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove DQ review answers option"
          git push origin HEAD:jon-nelson-custom
