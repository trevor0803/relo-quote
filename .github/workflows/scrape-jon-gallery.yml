name: Apply Jon Tattoo Gallery

on:
  push:
    branches:
      - jon-nelson-custom
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: jon-nelson-custom

      - name: Build the official gallery into the lander
        run: |
          python - <<'PY'
          import html as html_lib
          import json
          import re
          from pathlib import Path

          REMOVED_PHOTO = "https://cdn.prod.website-files.com/6692f96bc16e92e88e87f089/669308e9c16e92e88e90746f_IMG_2798.jpg"
          HERO_IMAGE = "https://cdn.prod.website-files.com/6692f96cc16e92e88e87f0fe/67035af0cdec0bfd099ef252_Zeus.jpg"
          STUDIO_IMAGE = "https://cdn.prod.website-files.com/6692f96bc16e92e88e87f089/6764d6ed1e5e92375a5bbb11_Jon-Nelson-Tattoo-Parlor.png"
          TITLES = [
              "Zeus", "Wolf Sleeve", "Wolf Head", "Split Face", "Souls Knight",
              "Royal Flush", "Realistic Ribs", "Poseidon and the Sea",
              "Portrait in Dark Arts", "Octopus", "Mythological Sleeve",
              "Medusa Half Sleeve", "Marilyn Monroe", "Logan", "Lantern with Moth",
              "Lady Justice", "Knight Rider", "Joker Polaroid",
              "Halloween Haunted House", "Greek Mythology Mural",
              "Frankenstein and Bride of Frankenstein", "Florida Panther and Knight",
              "Floral and Snake", "Evil Shaman", "Evil Crow Stabbing", "Dog Portrait",
              "Dog Memorial", "Dark Native with Headdress", "Dark Arts Owl",
              "Dark Arts Bird", "Castle Leg", "Castle Arm", "Castle Queen",
              "Castle Head", "Castle Feet", "Boston Polaroid"
          ]

          manifest = json.loads(Path("tattoo-images.json").read_text(encoding="utf-8"))
          sources = [item["src"] for item in manifest["images"] if "6692f96cc16e92e88e87f0fe" in item["src"]]
          if len(sources) < len(TITLES):
              raise RuntimeError(f"Expected {len(TITLES)} official images, found {len(sources)}")
          sources = sources[:len(TITLES)]
          official = [{"title": title, "src": src} for title, src in zip(TITLES, sources)]
          Path("tattoo-images.json").write_text(
              json.dumps({"source": "https://www.jonnelsontattoos.com/tattoos", "count": len(official), "images": official}, indent=2),
              encoding="utf-8",
          )

          path = Path("index.html")
          page = path.read_text(encoding="utf-8")
          page = page.replace(
              f'<div class="heroimg"><img src="{REMOVED_PHOTO}" alt="Jon Nelson tattooing a client" fetchpriority="high"></div>',
              f'<div class="heroimg"><img src="{HERO_IMAGE}" alt="Zeus black and grey tattoo by Jon Nelson" fetchpriority="high"></div>',
          )
          page = page.replace(
              f'<div class="consultVisual"><img src="{REMOVED_PHOTO}" alt="Jon Nelson tattooing" loading="lazy"><div class="consultTag">',
              f'<div class="consultVisual"><img src="{STUDIO_IMAGE}" alt="Jon Nelson tattoo studio in Fort Lauderdale" loading="lazy"><div class="consultTag">',
          )
          if REMOVED_PHOTO in page:
              raise RuntimeError("The smiling-client tattooing photo is still present")

          cards = []
          for index, item in enumerate(official):
              title = html_lib.escape(item["title"], quote=True)
              loading = "" if index < 2 else ' loading="lazy"'
              cards.append(
                  f'        <figure class="piece" tabindex="0" role="button" aria-label="Open {title} tattoo full screen">'
                  f'<img src="{item["src"]}" alt="{title} tattoo by Jon Nelson"{loading} decoding="async">'
                  f'<figcaption class="cap">{title}</figcaption></figure>'
              )

          replacement = (
              '      <div class="grid" id="gallery" aria-label="Jon Nelson tattoo gallery">\n'
              + "\n".join(cards)
              + '\n      </div>\n      <div class="galleryCta">'
          )
          page, count = re.subn(
              r'      <div class="grid" id="gallery" aria-label="Jon Nelson tattoo gallery">.*?</div>\n      <div class="galleryCta">',
              replacement,
              page,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Could not replace the gallery block")

          page = re.sub(
              r'<span id="galleryCount" aria-live="polite">\d+ / \d+</span>',
              f'<span id="galleryCount" aria-live="polite">01 / {len(official):02d}</span>',
              page,
              count=1,
          )
          page = re.sub(
              r'    /\* GALLERY_LAYOUT_START \*/.*?    /\* GALLERY_LAYOUT_END \*/\n',
              "",
              page,
              flags=re.S,
          )
          layout_css = (
              "    /* GALLERY_LAYOUT_START */\n"
              "    .grid .piece{grid-column:span 4;aspect-ratio:.82}\n"
              "    .grid .piece:nth-child(6n+1),.grid .piece:nth-child(6n+4){grid-column:span 8;aspect-ratio:1.25}\n"
              "    /* GALLERY_LAYOUT_END */\n"
          )
          page = page.replace("    .cap{position:absolute", layout_css + "    .cap{position:absolute", 1)
          path.write_text(page, encoding="utf-8")
          print(f"Applied {len(official)} official tattoo images")
          PY

      - name: Commit the updated landing page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tattoo-images.json
          git diff --cached --quiet && exit 0
          git commit -m "Use complete Jon Nelson tattoo gallery"
          git push origin HEAD:jon-nelson-custom
